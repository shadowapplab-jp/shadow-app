<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>SHADOW — ただ、受け止める</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#e9e7f2;background:#101019}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 42%,#242337 0%,#14141f 50%,#101019 100%)}main{max-width:540px;margin:auto;min-height:100dvh;padding:35px 22px 30px;display:flex;flex-direction:column;align-items:center}header{text-align:center}h1{font-weight:400;font-size:17px;letter-spacing:.42em;margin:0 0 9px;padding-left:.42em}header p{font-size:12px;letter-spacing:.1em;color:#9c9ba9;margin:0}.stage{position:relative;flex:1;min-height:290px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.halo{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#49445d36,transparent 69%)}.shadow{position:relative;width:160px;height:175px;background:radial-gradient(ellipse at 42% 34%,#59546e 0%,#363344 42%,#24222f 75%);border-radius:45% 55% 46% 54% / 47% 43% 57% 53%;filter:drop-shadow(0 0 23px #65607855);animation:breathe 5s ease-in-out infinite;transform-origin:center;transition:filter .5s}.shadow:before,.shadow:after{content:"";position:absolute;inset:7px;border-radius:inherit;background:#47435766;filter:blur(18px)}.shadow:after{inset:-7px;background:#69627a38;filter:blur(21px)}@keyframes breathe{0%,100%{transform:translateY(4px) scale(.98) rotate(-2deg);border-radius:45% 55% 46% 54% / 47% 43% 57% 53%}50%{transform:translateY(-5px) scale(1.03) rotate(2deg);border-radius:54% 46% 53% 47% / 53% 50% 50% 47%}}.shadow.receiving{animation:receive 2.1s ease-in-out 1}@keyframes receive{0%{transform:scale(1)}35%{transform:scale(1.17,1.08);filter:drop-shadow(0 0 35px #aaa2ca88)}65%{transform:scale(.91,1.06)}100%{transform:scale(1)}}.particles{position:absolute;inset:0;pointer-events:none}.particle{position:absolute;left:50%;top:57%;width:5px;height:5px;background:#c1b7d3;border-radius:50%;opacity:0;animation:drift 1.6s ease-in forwards}@keyframes drift{0%{opacity:.9;transform:translate(var(--x),var(--y)) scale(1)}100%{opacity:0;transform:translate(0,-30px) scale(.2)}}.panel{width:100%;padding:0 2px 6px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.button,button{font:inherit;cursor:pointer;border:1px solid #514e61;background:#292736;color:#dedce8;border-radius:14px;padding:12px 15px;transition:background .2s}.tabs button{font-size:13px;color:#a6a3b4;background:#1d1c29}.tabs button[aria-selected=true]{color:#fff;background:#3b374b;border-color:#706980}textarea{width:100%;min-height:114px;resize:vertical;padding:17px;background:#1c1b29;border:1px solid #494558;border-radius:17px;color:#f1edf7;font:inherit;font-size:16px;line-height:1.7;outline:none}textarea:focus{border-color:#9a91b0}textarea::placeholder{color:#777386}.primary{width:100%;margin-top:11px;background:#595168;border-color:#70657e;color:white;font-size:15px;padding:15px}.primary:disabled{opacity:.45;cursor:default}.hint{font-size:12px;line-height:1.8;text-align:center;color:#a5a0b0;min-height:42px;margin:12px 0 4px}.voicebox{text-align:center;border:1px solid #494558;border-radius:17px;background:#1c1b29;padding:20px 14px}.voicebox p{font-size:13px;color:#bdb8c8;line-height:1.8;margin:0 0 12px}.voicebox .meter{height:4px;width:65%;margin:12px auto 0;border-radius:4px;background:#343043;overflow:hidden}.voicebox .level{height:100%;width:0;background:#a69ab9;transition:width .08s}.voicebox button{min-width:170px}footer{text-align:center;font-size:11px;line-height:1.8;color:#777383;margin-top:18px}.hidden{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(prefers-reduced-motion:reduce){.shadow{animation:none}.shadow.receiving{animation:none}.particle{animation:none}}
</style></head><body><main><header><h1>SHADOW</h1><p>今の気持ちを、ありのままに。</p></header><section class="stage" aria-label="あなたの影"><div class="halo"></div><div class="shadow" id="shadow"></div><div class="particles" id="particles"></div></section><section class="panel"><div class="tabs" role="tablist" aria-label="入力方法"><button id="textTab" role="tab" aria-selected="true">文字で</button><button id="voiceTab" role="tab" aria-selected="false">声で</button></div><div id="textPanel"><label class="sr" for="entry">吐き出したいこと</label><textarea id="entry" placeholder="今の気持ちを、ありのままに。" autocomplete="off" spellcheck="false"></textarea><button class="primary" id="giveText">影に預ける</button></div><div id="voicePanel" class="hidden"><div class="voicebox"><p>声は録音・文字起こししません。<br>話し終えたら、影に預けてください。</p><button id="micButton">声を出す</button><div class="meter" aria-hidden="true"><div class="level" id="level"></div></div></div><button class="primary hidden" id="giveVoice">影に預ける</button></div><p class="hint" id="hint" aria-live="polite">ブラウザで開いてください。</p></section><footer>試作品 v0.3 · 内容を保存・送信しない設計<br>音声は端末上で音量のみ検出します。マイク権限が必要です。</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const shadow=$('shadow'),entry=$('entry'),hint=$('hint');let busy=false,stream=null,ctx=null,source=null,analyser=null,raf=0,voiceStarted=false;hint.textContent='';function setTab(mode){if(busy)return;stopMic();const text=mode==='text';$('textTab').setAttribute('aria-selected',String(text));$('voiceTab').setAttribute('aria-selected',String(!text));$('textPanel').classList.toggle('hidden',!text);$('voicePanel').classList.toggle('hidden',text);hint.textContent=''}$('textTab').onclick=()=>setTab('text');$('voiceTab').onclick=()=>setTab('voice');function particles(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const holder=$('particles');holder.replaceChildren();for(let i=0;i<13;i++){const p=document.createElement('i');p.className='particle';p.style.setProperty('--x',(Math.random()*250-125)+'px');p.style.setProperty('--y',(Math.random()*100+35)+'px');p.style.animationDelay=(Math.random()*.35)+'s';holder.appendChild(p)}setTimeout(()=>holder.replaceChildren(),2100)}function receive(){if(busy)return;busy=true;entry.value='';stopMic();$('giveVoice').classList.add('hidden');$('micButton').textContent='声を出す';shadow.classList.remove('receiving');void shadow.offsetWidth;shadow.classList.add('receiving');particles();hint.textContent='受け取っています…';$('giveText').disabled=true;setTimeout(()=>{shadow.classList.remove('receiving');hint.textContent='';$('giveText').disabled=false;busy=false},2300)}$('giveText').onclick=()=>{if(entry.value.trim())receive();else hint.textContent='文字を入力してから、影に預けて。'};function stopMic(){cancelAnimationFrame(raf);raf=0;if(stream){for(const track of stream.getTracks())track.stop();stream=null}if(source){try{source.disconnect()}catch{}source=null}if(analyser){try{analyser.disconnect()}catch{}analyser=null}if(ctx){ctx.close().catch(()=>{});ctx=null}$('level').style.width='0';voiceStarted=false}function meter(){if(!analyser)return;const arr=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(arr);let sum=0;for(const v of arr){const n=(v-128)/128;sum+=n*n}const rms=Math.sqrt(sum/arr.length);$('level').style.width=Math.min(100,Math.round(rms*650))+'%';raf=requestAnimationFrame(meter)}$('micButton').onclick=async()=>{if(busy)return;if(stream){stopMic();$('micButton').textContent='声を出す';$('giveVoice').classList.remove('hidden');hint.textContent='';return}if(!navigator.mediaDevices?.getUserMedia){hint.textContent='マイクはHTTPSのページをSafariなどで開く必要があります。この表示環境では利用できません。';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=512;source.connect(analyser);voiceStarted=true;$('micButton').textContent='話し終える';$('giveVoice').classList.add('hidden');hint.textContent='';meter()}catch(e){stopMic();hint.textContent='マイクを利用できません。HTTPSで開いてマイクを許可してください。'}};$('giveVoice').onclick=receive;document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMic();$('micButton').textContent='声を出す';$('giveVoice').classList.add('hidden')}});window.addEventListener('pagehide',()=>{stopMic();entry.value=''})})();
</script></body></html>
